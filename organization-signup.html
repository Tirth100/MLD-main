<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Signup - Meeting Leech Detector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="card glass-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold mb-1">Create Organization</h3>
                        <p class="text-muted">Register your company to get started</p>
                    </div>

                    <form id="orgSignupForm">
                        <div class="mb-3">
                            <label for="orgName" class="form-label">Organization Name</label>
                            <input type="text" class="form-control" id="orgName" placeholder="e.g. ABC Pvt Ltd" required>
                        </div>
                        <div class="mb-3">
                            <label for="managerName" class="form-label">Manager Name</label>
                            <input type="text" class="form-control" id="managerName" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label for="orgEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="orgEmail" placeholder="Enter work email" required>
                        </div>
                        <div class="mb-4">
                            <label for="orgPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="orgPassword" placeholder="Create password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm login-btn mb-3">
                            Register Organization
                        </button>
                    </form>
                    
                    <div id="orgSuccessMessage" class="alert alert-success d-none text-center" role="alert">
                        <strong>Success!</strong> Your Organization Code is: <br>
                        <h4 class="fw-bold mt-2 text-primary" id="displayOrgCode">ORG1234</h4>
                        <p class="mb-0 small">Save this code! Your employees need it to join.</p>
                        <a href="index.html" class="btn btn-sm btn-outline-success mt-2">Go to Login</a>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-decoration-none small text-muted">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
