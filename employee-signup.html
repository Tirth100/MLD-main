<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Signup - Meeting Leech Detector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="card glass-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold mb-1">Employee Signup</h3>
                        <p class="text-muted">Join your organization's workspace</p>
                    </div>

                    <form id="empSignupForm">
                        <div class="mb-3">
                            <label for="empName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="empName" placeholder="Enter your full name" required>
                        </div>
                        <div class="mb-3">
                            <label for="empEmail" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="empEmail" placeholder="Enter work email" required>
                        </div>
                        <div class="mb-3">
                            <label for="empPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="empPassword" placeholder="Create password" required>
                        </div>
                        <div class="mb-4">
                            <label for="orgCodeInput" class="form-label">Organization Code</label>
                            <input type="text" class="form-control fw-bold text-center" id="orgCodeInput" placeholder="e.g. ORG1234" required>
                            <div class="form-text">Ask your manager for the Org Code.</div>
                        </div>
                        <button type="submit" class="btn btn-secondary w-100 py-2 fw-semibold shadow-sm login-btn mb-3">
                            Join Organization
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-decoration-none small text-muted">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
