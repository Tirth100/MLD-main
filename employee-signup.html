<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Signup - Meeting Leech Detector</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="card glass-card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold mb-1">Employee Signup</h3>
                        <p class="text-muted">Join your organization's workspace</p>
                    </div>

                    <form id="empSignupForm" onsubmit="event.preventDefault();">
                        <div class="mb-4">
                            <label for="orgCodeInput" class="form-label">Organization Code</label>
                            <input type="text" class="form-control fw-bold text-center" id="orgCodeInput" placeholder="e.g. ORG1234" required>
                            <div class="form-text">Ask your manager for the Org Code.</div>
                        </div>
                        
                        <div id="g_id_onload"
                             data-client_id="875383442505-ed88ee414calm9tf9rga4s8foi8fj1j1.apps.googleusercontent.com"
                             data-context="signup"
                             data-ux_mode="popup"
                             data-callback="handleGoogleEmpSignup"
                             data-auto_prompt="false">
                        </div>
                        <div class="d-flex justify-content-center mb-3">
                            <div class="g_id_signin"
                                 data-type="standard"
                                 data-shape="rectangular"
                                 data-theme="outline"
                                 data-text="signup_with"
                                 data-size="large"
                                 data-logo_alignment="left">
                            </div>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="index.html" class="text-decoration-none small text-muted">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Custom JS -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
