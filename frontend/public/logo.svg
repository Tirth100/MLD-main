<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="mldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mldGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#0b0f19" fill-opacity="0.25" />

  <!-- Outer Radar Track -->
  <circle cx="32" cy="32" r="21" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="2 3" />

  <!-- Middle Focus Ring -->
  <circle cx="32" cy="32" r="13" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2.5" />

  <!-- Sweeping Focus / Detection Wave -->
  <path d="M 32 32 L 32 11 A 21 21 0 0 1 53 32 Z" fill="url(#pulseGrad)" />

  <!-- Radar Sweep Arm -->
  <line x1="32" y1="32" x2="32" y2="11" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Core Target -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="32" cy="32" r="2" fill="#0284c7" />

  <!-- Engagement Detection Signal Indicator -->
  <circle cx="43" cy="21" r="2.8" fill="#10b981" filter="url(#glow)" />
</svg>

